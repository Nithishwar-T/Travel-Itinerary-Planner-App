<div class="login-container">

  <h1>Travel Itinerary Planner</h1>

  <h2>Login</h2>

  <form (ngSubmit)="login()">

    <div>
      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Enter your email"
        required
      />
    </div>

    <div>
      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Enter your password"
        required
      />
    </div>

    <button type="submit">
      Login
    </button>

  </form>

</div>
