<h1>Destinations</h1>

<h2>Add Destination</h2>

<form (ngSubmit)="createDestination()">

  <div>
    <label>Name:</label>
    <input
      type="text"
      [(ngModel)]="newDestination.name"
      name="name"
      required>
  </div>

  <div>
    <label>City:</label>
    <input
      type="text"
      [(ngModel)]="newDestination.city"
      name="city"
      required>
  </div>

  <div>
    <label>Country:</label>
    <input
      type="text"
      [(ngModel)]="newDestination.country"
      name="country"
      required>
  </div>

  <div>
    <label>Description:</label>
    <textarea
      [(ngModel)]="newDestination.description"
      name="description"
      required>
    </textarea>
  </div>

  <button type="submit">Add Destination</button>

</form>

<hr>

<h2>Available Destinations</h2>

<div *ngFor="let destination of destinations">

  <h3>{{ destination.name }}</h3>

  <p>
    {{ destination.city }}, {{ destination.country }}
  </p>

  <p>{{ destination.description }}</p>

  <button (click)="editDestination(destination)">
  Edit
</button>

  <button (click)="deleteDestination(destination.id)">
  Delete
</button>

</div>
